<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="770" viewBox="0 110 1640 770">
  <title>Figure 4.1 — ERPSYS physical deployment diagram</title>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #111827; }
    .st { font-size: 12px; font-style: italic; fill: #475569; text-anchor: middle; }
    .nm { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .nm2 { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .dt { font-size: 12px; fill: #334155; text-anchor: middle; }
    .lb { font-size: 12px; fill: #111827; text-anchor: middle; }
    .lbl { font-size: 12px; fill: #111827; }
    .front { stroke: #1f2937; stroke-width: 1.6; }
    .top { fill: #e5e9f0; stroke: #1f2937; stroke-width: 1.6; }
    .side { fill: #cfd6e0; stroke: #1f2937; stroke-width: 1.6; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.4; }
    .link { fill: none; stroke: #1f2937; stroke-width: 1.6; }
    .dash { fill: none; stroke: #1f2937; stroke-width: 1.6; stroke-dasharray: 7 5; }
    .pill { fill: #ffffff; stroke: #94a3b8; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <rect y="110" width="1640" height="770" fill="#ffffff"/>

  <!-- Client device -->
  <g>
    <polygon class="top" points="40,260 54,246 304,246 290,260"/>
    <polygon class="side" points="290,260 304,246 304,526 290,540"/>
    <rect class="front" x="40" y="260" width="250" height="280" fill="#fdf4ff"/>
    <text class="st" x="165" y="282">«device»</text>
    <text class="nm" x="165" y="301">Client device</text>
    <text class="dt" x="165" y="318">laptop · phone</text>

    <polygon class="top" points="60,345 68,337 278,337 270,345"/>
    <polygon class="side" points="270,345 278,337 278,507 270,515"/>
    <rect class="front" x="60" y="345" width="210" height="170" fill="#ffffff"/>
    <text class="st" x="165" y="365">«executionEnvironment»</text>
    <text class="nm2" x="165" y="383">Web browser</text>

    <rect class="box" x="78" y="400" width="174" height="96" fill="#f8fafc"/>
    <path d="M232,406 h9 l5,5 v14 h-14 z M241,406 v5 h5" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="st" x="165" y="424">«artifact»</text>
    <text class="nm2" x="165" y="443">React SPA</text>
    <text class="dt" x="165" y="461">React 19 · Vite bundle</text>
    <text class="dt" x="165" y="478">Turnstile widget</text>
  </g>

  <!-- Cloudflare edge -->
  <g>
    <polygon class="top" points="400,260 414,246 664,246 650,260"/>
    <polygon class="side" points="650,260 664,246 664,536 650,550"/>
    <rect class="front" x="400" y="260" width="250" height="290" fill="#fff7ed"/>
    <text class="st" x="525" y="282">«node»</text>
    <text class="nm" x="525" y="301">Cloudflare edge</text>
    <text class="dt" x="525" y="318">proxied DNS for the domain</text>

    <rect class="box" x="420" y="332" width="210" height="52"/>
    <rect x="607" y="338" width="14" height="18" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="341" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="349" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="nm2" x="515" y="355">TLS termination</text>
    <text class="dt" x="515" y="373">edge certificate</text>

    <rect class="box" x="420" y="396" width="210" height="52"/>
    <rect x="607" y="402" width="14" height="18" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="405" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="413" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="nm2" x="515" y="419">WAF</text>
    <text class="dt" x="515" y="437">managed rules · DDoS</text>

    <rect class="box" x="420" y="460" width="210" height="72"/>
    <rect x="607" y="466" width="14" height="18" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="469" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <rect x="603" y="477" width="8" height="4" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="nm2" x="515" y="483">Turnstile</text>
    <text class="dt" x="515" y="501">bot check on sign-in</text>
    <text class="dt" x="515" y="518">token verified by the API</text>
  </g>

  <!-- Ubuntu VM -->
  <g>
    <polygon class="top" points="760,150 774,136 1164,136 1150,150"/>
    <polygon class="side" points="1150,150 1164,136 1164,696 1150,710"/>
    <rect class="front" x="760" y="150" width="390" height="560" fill="#f0f9ff"/>
    <text class="st" x="955" y="172">«device»</text>
    <text class="nm" x="955" y="191">Ubuntu VM</text>
    <text class="dt" x="955" y="208">single application host</text>

    <polygon class="top" points="785,235 793,227 1133,227 1125,235"/>
    <polygon class="side" points="1125,235 1133,227 1133,392 1125,400"/>
    <rect class="front" x="785" y="235" width="340" height="165" fill="#ffffff"/>
    <text class="st" x="955" y="255">«executionEnvironment»</text>
    <text class="nm2" x="955" y="273">Website delivery</text>
    <text class="dt" x="955" y="290">:443 · static files + reverse proxy</text>
    <rect class="box" x="805" y="305" width="300" height="78" fill="#f8fafc"/>
    <path d="M1085,311 h9 l5,5 v14 h-14 z M1094,311 v5 h5" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="st" x="955" y="328">«artifact»</text>
    <text class="nm2" x="955" y="347">Website interface</text>
    <text class="dt" x="955" y="365">built SPA (HTML · JS · CSS)</text>

    <polygon class="top" points="785,455 793,447 1133,447 1125,455"/>
    <polygon class="side" points="1125,455 1133,447 1133,677 1125,685"/>
    <rect class="front" x="785" y="455" width="340" height="230" fill="#ffffff"/>
    <text class="st" x="955" y="475">«executionEnvironment»</text>
    <text class="nm2" x="955" y="493">Node.js application</text>
    <text class="dt" x="955" y="510">systemd unit · 127.0.0.1:3001</text>

    <rect class="box" x="805" y="524" width="300" height="70" fill="#f8fafc"/>
    <path d="M1085,530 h9 l5,5 v14 h-14 z M1094,530 v5 h5" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="st" x="955" y="545">«artifact»</text>
    <text class="nm2" x="955" y="564">Express API</text>
    <text class="dt" x="955" y="582">Enrollment rules and records</text>

    <rect class="box" x="805" y="604" width="300" height="66" fill="#f8fafc"/>
    <path d="M1085,610 h9 l5,5 v14 h-14 z M1094,610 v5 h5" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
    <text class="st" x="955" y="625">«artifact»</text>
    <text class="nm2" x="955" y="644">Better Auth</text>
    <text class="dt" x="955" y="661">sessions · Google sign-in</text>
  </g>

  <!-- Managed services -->
  <g>
    <polygon class="top" points="1330,150 1344,136 1594,136 1580,150"/>
    <polygon class="side" points="1580,150 1594,136 1594,246 1580,260"/>
    <rect class="front" x="1330" y="150" width="250" height="110" fill="#ecfdf5"/>
    <text class="st" x="1455" y="180">«managed database»</text>
    <text class="nm" x="1455" y="203">MongoDB Atlas</text>
    <text class="dt" x="1455" y="223">replica set · TLS</text>

    <polygon class="top" points="1330,300 1344,286 1594,286 1580,300"/>
    <polygon class="side" points="1580,300 1594,286 1594,396 1580,410"/>
    <rect class="front" x="1330" y="300" width="250" height="110" fill="#fff7ed"/>
    <text class="st" x="1455" y="330">«managed service»</text>
    <text class="nm" x="1455" y="353">Cloudflare Workers AI</text>
    <text class="dt" x="1455" y="373">student chat assistant model</text>

    <polygon class="top" points="1330,475 1344,461 1594,461 1580,475"/>
    <polygon class="side" points="1580,475 1594,461 1594,571 1580,585"/>
    <rect class="front" x="1330" y="475" width="250" height="110" fill="#eff6ff"/>
    <text class="st" x="1455" y="505">«external service»</text>
    <text class="nm" x="1455" y="528">Google APIs</text>
    <text class="dt" x="1455" y="548">OAuth 2.0 · Forms · Calendar</text>

    <polygon class="top" points="1330,625 1344,611 1594,611 1580,625"/>
    <polygon class="side" points="1580,625 1594,611 1594,721 1580,735"/>
    <rect class="front" x="1330" y="625" width="250" height="110" fill="#fff7ed"/>
    <text class="st" x="1455" y="655">«object storage»</text>
    <text class="nm" x="1455" y="678">Cloudflare R2</text>
    <text class="dt" x="1455" y="698">evidence uploads bucket</text>
  </g>

  <!-- Communication paths -->
  <path class="link" d="M304,340 H400" marker-end="url(#arrow)"/>
  <rect class="pill" x="310" y="331" width="84" height="18" rx="9"/>
  <text class="lb" x="352" y="344">HTTPS · 443</text>

  <path class="link" d="M664,340 H785" marker-end="url(#arrow)"/>
  <rect class="pill" x="670" y="331" width="84" height="18" rx="9"/>
  <text class="lb" x="712" y="344">HTTPS · 443</text>

  <path class="link" d="M955,400 V447" marker-end="url(#arrow)"/>
  <text class="lbl" x="966" y="428">Internal application connection</text>

  <path class="link" d="M1133,480 H1190 V205 H1330" marker-end="url(#arrow)"/>
  <rect class="pill" x="1202" y="196" width="120" height="18" rx="9"/>
  <text class="lb" x="1262" y="209">mongodb+srv · TLS</text>

  <path class="link" d="M1133,505 H1220 V355 H1330" marker-end="url(#arrow)"/>
  <rect class="pill" x="1233" y="346" width="88" height="18" rx="9"/>
  <text class="lb" x="1277" y="359">HTTPS · REST</text>

  <path class="link" d="M1133,530 H1330" marker-end="url(#arrow)"/>
  <rect class="pill" x="1200" y="521" width="120" height="18" rx="9"/>
  <text class="lb" x="1260" y="534">HTTPS · OAuth 2.0</text>

  <path class="link" d="M1133,560 H1200 V680 H1330" marker-end="url(#arrow)"/>
  <text class="lbl" x="1210" y="604">S3 API · HTTPS</text>
  <text class="lbl" x="1210" y="620">sign · read · delete</text>

  <path class="dash" d="M165,540 V800 H1455 V735" marker-end="url(#arrow)"/>
  <rect class="pill" x="575" y="791" width="450" height="18" rx="9"/>
  <text class="lb" x="800" y="804">HTTPS PUT with presigned URL — evidence upload goes straight to R2</text>

  <!-- Legend -->
  <path class="link" d="M40,848 H96" marker-end="url(#arrow)"/>
  <text class="lbl" x="106" y="852">request path (client → server → service)</text>
  <path class="dash" d="M400,848 H456" marker-end="url(#arrow)"/>
  <text class="lbl" x="466" y="852">direct browser upload, bypasses the VM</text>
</svg>
