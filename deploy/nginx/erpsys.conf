# ============================================================================
# ERPSYS — single-origin front door.
#
#   /            static SPA from /srv/erpsys/apps/web/dist  (Nginx, so Node
#                never spends CPU compressing and never serves stale assets)
#   /api/*       -> 127.0.0.1:3001   (Node, systemd unit `erpsys`)
#   /rpc/*       -> 127.0.0.1:3001
#
# Install
#   sudo cp deploy/nginx/erpsys.conf /etc/nginx/conf.d/erpsys.conf
#   sudo rm -f /etc/nginx/sites-enabled/default      # else :80 default clash
#   sudo nginx -t && sudo systemctl reload nginx
#
# Why conf.d/ and not sites-enabled/: Ubuntu's /etc/nginx/nginx.conf includes
# `conf.d/*.conf` from inside the `http` block. `limit_req_zone`, `upstream`
# and `log_format` are only legal in that context, and this file needs all
# three. Nothing else in conf.d/ is installed on a fresh box.
#
# Replace erpsys.example.edu.ph below with the real host, and make it match
# PUBLIC_SITE_URL and BETTER_AUTH_URL in /etc/erpsys.env. The server refuses
# to boot if PUBLIC_SITE_URL is a local origin, and better-auth's trustedOrigins
# is built from BETTER_AUTH_URL, so a mismatch here shows up as a 403 on every
# POST to /rpc.
# ============================================================================

# --- brotli -----------------------------------------------------------------
# NOT a directive you can keep in this file: `load_module` is main-context only.
# The filter is not in Ubuntu's stock nginx, so it must be installed and
# loaded by hand:
#
#   sudo apt-get install libnginx-mod-http-brotli-filter
#   ls /usr/lib/nginx/modules/ | grep brotli        # confirm the .so name
#   # then add, as the FIRST line of /etc/nginx/nginx.conf, above `events`:
#   load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
#
# If you skip it, delete the `brotli_*` lines in the server block below.
# `nginx -t` will fail with "unknown directive brotli" if the module is
# missing and the lines are left in. gzip below is always on and is a complete
# fallback on its own — brotli is a size win, not a correctness requirement.
# Full procedure: docs/ops/deployment.md §6.

# --- logging ---------------------------------------------------------------
# Upstream timings, because "the site was slow" and "Mongo was slow" are
# different pages at 2am and this log is the only thing that tells them apart.
# $upstream_response_time is `-` for anything served from disk, which is how a
# static hit is distinguished from an API hit in the same line.
log_format erpsys
  '$remote_addr - $time_iso8601 "$request" $status $body_bytes_sent '
  'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time '
  'uh="$upstream_addr" ua="$http_user_agent" rid=$request_id';

# --- rate limit zones ------------------------------------------------------
# Keyed on $binary_remote_addr, which on a single-host deployment is the
# student's real public IP: Nginx is the edge, so the socket peer is the
# client and no proxy protocol is involved.
#
# If a CDN or L4 load balancer is ever put in front, this key becomes the
# proxy's IP for every student and the limits below become a single global
# limit. The fix is `set_real_ip_from <proxy range>;` plus
# `real_ip_header` — see docs/ops/deployment.md §6 before adding one.
#
# ── Read the NAT warning before raising these. ──
# A campus with one egress NAT address means $binary_remote_addr is the SAME
# value for the entire institution, and these zones become a per-campus limit.
# The /rpc rate is sized for that case: ~1000 visible tabs at ~4 polls per 20s
# is ~200 req/s sustained institution-wide, so `rate=120r/s` per address is
# generous for one student and only just survivable for a whole campus behind
# one address. Both of these zones are currently the ONLY rate limiting in
# front of the app — the per-IP and per-user limiters in lib/rate-limit.ts are
# exported but not mounted in apps/server/src/index.ts. See
# docs/ops/deployment.md §3.
limit_req_zone $binary_remote_addr zone=erpsys_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=erpsys_rpc:10m rate=120r/s;

limit_req_status 429;
limit_req_log_level warn;

# --- upstream --------------------------------------------------------------
upstream erpsys_app {
    # max_fails=0 disables passive health checking. With a single upstream,
    # the default (max_fails=1 fail_timeout=10s) would eject the only peer
    # after one error and return 502 to 100% of traffic for the next 10
    # seconds. With one upstream there is nothing to fail over to, so the
    # check has no meaning — the `proxy_next_upstream` retry below is what
    # actually rides out a restart.
    server 127.0.0.1:3001 max_fails=0;

    # Upstream keep-alive pool. `Connection ""` in the locations below is what
    # makes this pool exist at all.
    keepalive 64;

    # ── keepalive, and why it is 5s longer than the app ──────────────────
    # Nginx's `keepalive_timeout` inside an upstream block is how long Nginx
    # considers an idle pooled connection reusable. Node's
    # `server.keepAliveTimeout` is 65s. The pool owner must always be the
    # LATER of the two, so that Nginx observes Node's FIN and drops the socket
    # itself instead of picking it out of the pool and writing to a socket the
    # other end has already closed.
    #
    # The reverse order is the classic intermittent-502 bug: a student on a
    # reused connection gets a 502 roughly once every keepalive cycle, it
    # correlates with nothing in the application, and it looks exactly like a
    # Node crash. Both sides of this number are set in the same place on
    # purpose:
    #
    #   Nginx upstream  keepalive_timeout  70s   (here)
    #   Node            keepAliveTimeout   65s   (apps/server/src/index.ts)
    #   Nginx server    keepalive_timeout  65s   (client-facing, below)
    #
    # apps/server/src/index.ts must set keepAliveTimeout=65000 and
    # headersTimeout > keepAliveTimeout (Node drops request headers otherwise).
    # Verify after any change: docs/ops/deployment.md §11 has the one-liner.
    keepalive_timeout 70s;
}

server {
    listen 80;
    listen [::]:80;
    server_name erpsys.example.edu.ph;

    # ACME challenge stays on plain HTTP so renewals work before/without TLS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name erpsys.example.edu.ph;

    # certbot manages these four paths. `certbot --nginx` rewrites them in
    # place; do not hand-edit them, re-run certbot instead.
    ssl_certificate     /etc/letsencrypt/live/erpsys.example.edu.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erpsys.example.edu.ph/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /srv/erpsys/apps/web/dist;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/erpsys.access.log erpsys;
    error_log  /var/log/nginx/erpsys.error.log warn;

    # 8m ceiling for JSON bodies and proxied API payloads. File bytes
    # bypass Express entirely (browser → Google resumable session), so this
    # is a ceiling and not a memory cost.
    # The other JSON routes are far below it: `express.json()` defaults to
    # 100kb and routes/chat.ts sets an explicit 100kb, so a large body is
    # rejected by Express with 413 regardless of this number.
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    # ── keepalive, client-facing ──────────────────────────────────────────
    # Equal to the app's keepAliveTimeout (65_000). If this is LONGER than
    # Node's, a browser can hand Nginx a request on a connection whose upstream
    # half died; if it is much SHORTER, every keepalive is renegotiated and the
    # handshake cost shows up in p95. Equal is the intent — change one, change
    # both, and re-read the upstream block above.
    keepalive_timeout 65s;
    keepalive_requests 1000;
    tcp_nopush on;

    # ── security headers ──────────────────────────────────────────────────
    # Set here rather than in Express: helmet/CORS are explicitly out of scope
    # for the app (same-origin deployment, Nginx owns the edge). Note the app
    # still sends X-Powered-By; it is stripped below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── compression ───────────────────────────────────────────────────────
    # Node does no compression at all, so this is the only place it happens.
    # `text/event-stream` is deliberately absent from both type lists: the SSE
    # stream is already chunked and compressing it buffers the stream and
    # defeats the heartbeat.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/html
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 512;
    # brotli_dynamic on;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/html
    #     application/javascript
    #     application/json
    #     application/xml
    #     image/svg+xml;

    # ── shared proxy defaults ─────────────────────────────────────────────
    # Applied by every location that proxies to Node.
    proxy_http_version 1.1;
    # Clearing Connection is what puts the upstream socket into the keepalive
    # pool above instead of having Nginx close it after every response.
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # apps/server/src/index.ts sets `trust proxy`, so X-Forwarded-For is what
    # lib/rate-limit.ts's clientIp() reads for the per-IP limits. Stripping this
    # header on an /api/auth request would let a client spoof its rate-limit
    # identity by sending its own X-Forwarded-For.
    proxy_hide_header X-Powered-By;

    # ── retry across a restart ────────────────────────────────────────────
    # READ THIS BEFORE ASSUMING IT MAKES A DEPLOY INVISIBLE.
    #
    # What it does buy, and it is worth having: with `Connection ""` above,
    # Nginx holds idle upstream sockets in the keepalive pool. A request
    # arriving on a pooled socket that Node has just closed (step 4 of the
    # shutdown, `closeIdleConnections()`) gets ECONNRESET. `error` retries it
    # on a FRESH connection to a process that is still listening, and the
    # client never sees anything. That is the common case and it is why this
    # directive is here.
    #
    # What it does NOT buy: it does not wait. `proxy_next_upstream` retries
    # immediately, it does not pause until the upstream comes back. With one
    # upstream there is no second peer to fail over to, so the residual window
    # — from `server.close()` until the restarted process listens — is bridged
    # by the CLIENT (TanStack Query retries; SSE clients reconnect on the
    # `reconnect` event) and not by Nginx. The only server-side thing that
    # actually shortens that window is `DRAIN_DELAY_MS`, because during it the
    # process is still accepting: requests landing in those 2 seconds are
    # served normally and never enter the window at all.
    #
    # Timeline, with the values in deploy/erpsys.service and the defaults in
    # lib/env.ts:
    #
    #   t=0s     systemd SIGTERMs Node. /api/ready flips to 503 immediately.
    #   t=0..2s  DRAIN_DELAY_MS=2000 — still accepting, still serving. This is
    #            the overlap that keeps a deploy invisible for most requests.
    #   t=2s     server.close(). The socket stops accepting.
    #   t=2s     lib/sse.ts publishToAll() tells every SSE subscriber to
    #            reconnect, while their sockets still work.
    #   t=2..12s SHUTDOWN_GRACE_MS=10000 — in-flight requests finish.
    #   t=12s    process.exit(0).
    #   t=12..14s RestartSec=2.
    #   t≈14.5s  new process: Mongo ping, ensureIndexes, listen(). Typically
    #            well under a second of work; a cold Atlas connect can add up
    #            to connectTimeoutMS=10000, which would push it past 30s.
    #
    # `proxy_next_upstream_timeout` is the bound on a retry SEQUENCE, not a
    # wait for the upstream. 30s is set because it must exceed the whole
    # restart window with margin: 2 (drain) + 10 (grace) + 2 (RestartSec) +
    # ~1.5 (boot) = ~15.5s, and 30s absorbs a cold Atlas connect on top. It
    # also satisfies the spec's requirement that the window be longer than
    # `DRAIN_DELAY_MS` — 30 > 2 by a wide margin. If you retune
    # `SHUTDOWN_GRACE_MS` or `RestartSec`, recompute it.
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 30s;
    # The cost of the long window: when the upstream is genuinely gone, a
    # request can sit here rather than failing fast. `proxy_connect_timeout`
    # below bounds each individual attempt, and the app's own `Retry-After`
    # path (§ docs/ops/deployment.md §10.1) is the fast path for a saturated
    # pool.

    # Connect timeout is short and separate: if Node is not listening, fail in
    # 2s and take the retry above, rather than holding the client for the full
    # read timeout.
    proxy_connect_timeout 2s;
    # Default for every location that is NOT /api/events. Bounded on purpose:
    # a hung Mongo operation must not hold an Nginx worker and a client socket
    # open indefinitely. 30s is comfortably above the Mongo driver's own
    # bounds (waitQueueTimeoutMS 5s, serverSelectionTimeoutMS 5s,
    # socketTimeoutMS 45s) for any request that is going to succeed.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # ── health endpoints ──────────────────────────────────────────────────
    # Never rate limited: a 429 here reads as "the site is down" to whatever
    # is watching. Never access-logged: one line per probe at 5s intervals is
    # noise that buries the 502s.
    location = /api/ready {
        access_log off;
        proxy_pass http://erpsys_app;
    }

    location = /api/health {
        access_log off;
        proxy_pass http://erpsys_app;
    }

    # ── metrics ───────────────────────────────────────────────────────────
    # BLOCKED by default. Read this before enabling it.
    #
    # The app gates /api/metrics on "loopback or a valid METRICS_TOKEN". Behind
    # Nginx every request arrives from 127.0.0.1, so the loopback test passes
    # for every client on the internet. Proxying this location with
    # METRICS_TOKEN unset therefore publishes the process's internals to anyone
    # who asks. There is no configuration of the app that makes an
    # Nginx-proxied /api/metrics safe without the token.
    #
    # Default posture: scrape from the host itself.
    #   curl -s http://127.0.0.1:3001/api/metrics
    # That is the loopback path the gate is designed for, and it needs no
    # token and no change to this file.
    #
    # To scrape from a monitoring host instead: set METRICS_TOKEN in
    # /etc/erpsys.env, then replace the `return 404` below with a plain
    # proxy_pass:
    #
    #   location = /api/metrics {
    #       proxy_pass http://erpsys_app;
    #   }
    #
    # No auth check is needed here and adding one would be a mistake: the app
    # already gates the endpoint and answers 404 on a bad token, so a rejected
    # scrape is not confirmable by status code. But the token must then reach
    # it, and the only two forms the app accepts (lib/metrics.ts
    # `isMetricsRequestAllowed`) are a header or a query parameter:
    #
    #   Authorization: Bearer <METRICS_TOKEN>
    #   /api/metrics?token=<METRICS_TOKEN>
    #
    # Note the query-string form puts the token in the access log and in Nginx
    # error logs. Prefer the header. The path stays a fixed `location =`, so no
    # user-supplied value ever reaches an `if`.
    #
    # With METRICS_TOKEN empty, `location = /api/metrics { proxy_pass ... }` on
    # its own publishes the process internals to the internet, because the
    # socket peer is 127.0.0.1. The `return 404` below is the shipped default
    # for exactly that reason.
    location = /api/metrics {
        return 404;
    }

    # ── SSE ───────────────────────────────────────────────────────────────
    # One hour, because the stream is meant to stay open: routes/events.ts
    # sends a heartbeat every 25s and the only reason to close it is a deploy.
    #
    # proxy_buffering off is the line that actually matters. Without it Nginx
    # reads the response into its own buffers before forwarding, the heartbeat
    # arrives late or not at all, and live queue updates silently stop working
    # while every other endpoint looks healthy.
    #
    # SSE is not an HTTP Upgrade handshake — there is no Upgrade/Connection
    # dance to make. What it needs is HTTP/1.1 to the upstream plus an empty
    # Connection header (set above) and unbuffered streaming, all three of
    # which are here.
    location = /api/events {
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://erpsys_app;
    }

    # ── chat stream ───────────────────────────────────────────────────────
    # Token-by-token SSE over POST, so the same unbuffered treatment. A
    # generous read timeout because a Workers AI stream can stall mid-stream
    # while the fallback model chain is tried; the app's own
    # CLOUDFLARE_REQUEST_DEADLINE_MS (30s) aborts the upstream call well inside
    # this window, so the chain can never outlive it.
    location = /api/chat/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        # `http_503` dropped — see the server-level note. A 503 from this
        # handler is the app shedding load (including the
        # CLOUDFLARE_CHAT_ENABLED kill switch), and retrying it immediately
        # would double the client's wait for a 503 it is going to get anyway.
        proxy_next_upstream error timeout;
        proxy_pass http://erpsys_app;
    }

    # ── auth ──────────────────────────────────────────────────────────────
    # The tight zone. 20/min sustained with a burst of 10 absorbs a student
    # retyping a password several times over a slow connection and nothing
    # more.
    #
    # This is currently the ONLY rate limiting in front of sign-in and sign-up:
    # lib/rate-limit.ts exports `authRateLimit` (20 per 5 min per IP) but it is
    # not mounted in apps/server/src/index.ts. Until it is, this zone is the
    # whole control, which is why the read-only auth endpoints are not exempt
    # from it here. See docs/ops/deployment.md §3.
    location ^~ /api/auth/ {
        limit_req zone=erpsys_auth burst=10 nodelay;
        proxy_pass http://erpsys_app;
    }

    # ── RPC ───────────────────────────────────────────────────────────────
    # The generous zone. Every poll on every open tab lands here, so this has
    # to clear the institution's aggregate polling rate with margin — see the
    # NAT warning above the limit_req_zone definitions before touching it.
    #
    # lib/rate-limit.ts also has a per-user `rpcRateLimit` (300/min) designed
    # for this path, but it is not mounted in apps/server/src/index.ts yet, so
    # today this zone is the only limiter here. That is fine for the polling
    # shape — the limit is per address, not per user, and the rate is sized for
    # the institution's aggregate — but it means a single student's runaway tab
    # is bounded by the campus-wide budget rather than their own.
    location ^~ /rpc/ {
        limit_req zone=erpsys_rpc burst=300 nodelay;
        # `http_503` dropped — see the server-level note. This is the important
        # one: a pool-exhaustion 503 comes with `Retry-After: 5` and exists to
        # shed load. Retrying it here would re-run the same request against the
        # same saturated pool, hold the client for 2x waitQueueTimeoutMS
        # (10s), and still return 503 — turning a correct backpressure signal
        # into a slower version of itself. `error timeout` still covers the
        # restart, because a closing socket is a connection error, not a 503.
        proxy_next_upstream error timeout;
        proxy_pass http://erpsys_app;
    }

    # ── everything else under /api ────────────────────────────────────────
    location ^~ /api/ {
        proxy_next_upstream error timeout;
        proxy_pass http://erpsys_app;
    }

    # ── static assets ─────────────────────────────────────────────────────
    # Vite writes content-hashed filenames into /assets, so they are immutable
    # and safe to cache for a year. A new build changes the filenames, so a
    # deploy invalidates the cache without anyone having to.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────
    # A hard refresh on /app/student has to serve index.html, and the client
    # router takes it from there. The /api and /rpc blocks above are `^~`
    # prefixes, so they win over this one and a genuine API 404 stays a 404
    # instead of becoming a 200 full of HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
