name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build-only placeholders; env validation runs at import time during `vite build`.
      # No live database or auth calls happen in CI. Use repo secrets for real values.
      DATABASE_URL: mongodb://localhost:27017/erpsys_ci
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Build
        run: bun run build
